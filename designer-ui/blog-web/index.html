<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>%VITE_APP_TITLE%</title>
    <style>
      #app-boot {
        position: fixed;
        inset: 0;
        z-index: 3000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: var(--color-body, #f2f5f3);
        transition: opacity 0.25s ease;
      }
      #app-boot .boot-spinner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid color-mix(in srgb, var(--color-primary, #16a34a) 18%, transparent);
        border-top-color: var(--color-primary, #16a34a);
        animation: boot-spin 0.8s linear infinite;
      }
      #app-boot .boot-text {
        font-size: 13px;
        color: var(--color-text-secondary, #666);
        letter-spacing: 1px;
        font-family: 'Manrope', 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="app-boot">
      <div class="boot-spinner"></div>
      <div class="boot-text">加载中…</div>
    </div>
    <script>
      window.__removeBootLoading = function () {
        var boot = document.getElementById('app-boot')
        if (!boot) return
        boot.style.opacity = '0'
        setTimeout(function () {
          boot.parentNode && boot.parentNode.removeChild(boot)
        }, 260)
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
