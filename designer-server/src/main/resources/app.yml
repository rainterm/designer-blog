#
# Designer Admin 脚手架 - 应用配置
# 所有敏感项均支持环境变量 / 启动参数覆盖，例如：
#   java -jar app.jar --solon.dataSources.db1.password=xxx
#
server:
  port: 8080
  request:
    encoding: utf-8

solon.app:
  name: designer-server

# ============================ 线程模型 ============================
# 开启后 Solon 的并行/调度执行器使用虚拟线程（JDK 21+）：
# 日志落库、消息发送等 I/O 旁路任务（RunUtil.asyncAndTry）不再占用平台线程。
solon.threads.virtual.enabled: true

# ============================ 配置密钥加密（可选）============================
# 「存储配置」里的 accessKey / secretKey 与「消息通道」里的 SMTP 密码，落库前会用该主密钥
# AES 加密成 ENC(...) 形态（实现见 framework 的 ConfigSecretUtil）。
#   · 不配置 → 保持明文，历史数据照常读取（升级无需刷库）；
#   · 配置后 → 只影响新写入的配置，旧明文仍能读；
#   · 换密钥 → 已存密文解不开，读取时会打 error 日志并回退原值，务必沿用同一密钥。
# AES 只接受 16 / 24 / 32 字节的密钥；请用环境变量注入，不要提交到仓库。
solon.vault:
  password: "${VAULT_PASSWORD:}"

# ============================ 接口文档（Knife4j）============================
# 访问 http://localhost:8080/doc.html；生产环境可用 KNIFE4J_ENABLE=false 关闭
knife4j:
  enable: "${KNIFE4J_ENABLE:true}"
  production: "${KNIFE4J_PRODUCTION:false}"
  setting:
    language: "zh-CN"
    swaggerModelName: "数据模型"

# ============================ 日志 ============================
# 使用 Solon 内置的 Logback 集成（solon-logging-logback）：
# 项目未提供 logback.xml / logback-solon.xml，因此由下列配置自动生成 appender。
# 同时输出到控制台与文件；文件按「天 + 单文件 10MB」滚动，最多保留 7 天，总量上限 1GB。
solon.logging.appender:
  console:
    enable: true
    level: INFO
    pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  file:
    enable: true
    # 当前日志文件为 "${LOG_PATH}.log"；滚动文件沿用 Solon 默认规则：
    #   ${name}_yyyy-MM-dd_序号.log
    name: "${LOG_PATH:logs/designer-server}"
    level: INFO
    extension: ".log"
    pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
    # 单文件达到该大小即滚动（按大小 + 按天，同时生效）
    maxFileSize: "10 MB"
    # 历史日志保留天数（同时决定按天滚动的文件数量上限）
    maxHistory: 7
    # 历史日志总量上限，0 表示不限制
    totalSizeCap: "1 GB"

solon.logging.logger:
  root:
    level: INFO

# ============================ 数据源（MySQL 8）============================
# 名字 db1 与下方 mybatis.db1 对应；结尾的 ! 表示注册为默认数据源
solon.dataSources:
  db1!:
    class: "com.zaxxer.hikari.HikariDataSource"
    driverClassName: "com.mysql.cj.jdbc.Driver"
    jdbcUrl: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:designer_blog}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&nullCatalogMeansCurrent=true"
    username: "${DB_USER:root}"
    password: "${DB_PASSWORD:root}"
    minimumIdle: 2
    maximumPoolSize: 10
    connectionTimeout: 30000
    idleTimeout: 600000
    maxLifetime: 1800000
    poolName: "designer-admin-pool"

# ============================ MyBatis-Plus ============================
mybatis.db1:
  mappers:
    # 系统模块：mapper 按业务域拆分子包（mapper/rbac、mapper/auth ...）
    - "com.designer.admin.system.mapper.**.*"
    # 其他模块：mapper 接口直接位于 mapper 包下
    - "com.designer.admin.module.**.mapper.*"
  configuration:
    mapUnderscoreToCamelCase: true
    # 开发期排查 SQL 时可打开：
    # logImpl: "org.apache.ibatis.logging.stdout.StdOutImpl"
  globalConfig:
    banner: false
    # mpj 连表注入器（必须显式声明，否则 mapper.selectJoinList 抛 Invalid bound statement）。
    # 类全名由 mybatis-plus-join-solon-plugin 自动装配成实例。
    sqlInjector: "com.github.yulichang.injector.MPJSqlInjector"
    metaObjectHandler: "com.designer.admin.framework.mybatis.AutoFillHandler"
    dbConfig:
      idType: "auto"
      logicDeleteField: "deleted"
      logicDeleteValue: 1
      logicNotDeleteValue: 0
      whereStrategy: "not_empty"

# ============================ Redis（Sa-Token 会话存储）============================
sa-token-dao-redis:
  server: "${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
  password: "${REDIS_PASSWORD:123456}"
  db: ${REDIS_DB:1}
  maxTotal: 64
  maxIdle: 16
  minIdle: 2
  maxWaitMillis: 3000

# ============================ Sa-Token ============================
sa-token:
  # token 名称（前端以其作为请求头名，不带 Bearer 前缀）
  token-name: "Authorization"
  # 默认绝对有效期 1 天（秒）；实际登录以参数 sys.account.tokenTimeout 为准
  timeout: 86400
  # 默认活跃续期 30 分钟；有请求自动续签，连续闲置超时踢出；参数 sys.account.tokenActiveTimeout
  active-timeout: 1800
  # 允许登录时按参数动态指定 active-timeout
  dynamic-active-timeout: true
  # 鉴权时自动续签 active-timeout（默认 true）
  auto-renew: true
  # 允许同一账号多端并发登录
  is-concurrent: true
  # 每次登录都新建 token
  is-share: false
  token-style: "uuid"
  # 纯 Header 模式，不读 cookie；SSE 需从 query 读 token（EventSource 无法自定义 Header）
  # 唯一的例外是私有下载：登录时下发 designer_download_token（Path 限定为
  # /admin-api/system/file/download/、HttpOnly），由 DownloadTokenCookieFilter 在进入
  # Sa-Token 之前把它提升成请求头。这里仍保持 false —— 全局读 cookie 会让整个
  # /admin-api/** 接受 Cookie 鉴权，等于把所有后台接口暴露在 CSRF 之下。
  is-read-cookie: false
  is-read-header: true
  is-read-param: true
  is-log: false

# ============================ 图形验证码（AJ-Captcha）============================
# 前台评论与后台登录**共用**这一套端点与存储（实现见
# designer-framework 的 com.designer.admin.framework.captcha 包）。
# 类型只有 blockPuzzle（滑块拼图）与 clickWord（文字点选）两种，没有字符型。
#
# 端点由插件自带的 CaptchaController 注册在根路径 /captcha/get、/captcha/check
# （路径写死，插件没有前缀配置项）。浏览器侧统一走 /app-api/captcha/**：
# framework 里另注册了一个薄 controller（AppCaptchaController）映射该前缀，
# 复用同一个 CaptchaService，并直接用插件的 getRemoteId 保证 browserInfo 一致。
# nginx 与 dev 代理都按普通 /app-api 转发，不做前缀改写；插件原生的 /captcha/** 两个站点都已显式 404。
# 因此：
#   · 公开 URL 落在 /app-api/** 下，Sa-Token 对该前缀默认免登录（正是我们需要的）；
#   · 后端真实端点仍**不受**业务 controller 上 @RateLimit 的覆盖 —— 注解加不到该 controller 上，
#     所以频控改由下面的 req-* 内置限流承担（它基于同一套 cache-type 计数，多实例下同样生效）；
#   · 两个站点的 nginx server 块都各有一条 /app-api/captcha/ location，只为把限流桶与普通 API 分开。
#
# 「要不要验」属于业务策略，不在这一层：前台看站点评论总开关，
# 后台看该账号连续失败是否达阈值（见 system 模块的 LoginAttemptService）。
aj:
  captcha:
    type: blockPuzzle
    # 必须与 RedisCaptchaCacheServiceImpl#type() 的返回值一致，否则查不到该实现
    cache-type: redis
    # 画在底图上的水印
    water-mark: "Designer Blog"
    # 拼图块与缺口的容差（像素）：越小越难，也越容易误伤手抖的真实用户
    slip-offset: 5
    # true → pointJson / captchaVerification 走 AES-128-ECB 加密。
    # 关掉会让 x 偏移变成明文，验证码退化成「约 60 次请求即可暴力试出」的摆设，故保持开启。
    aes-status: true
    interference-options: 1
    # 内置频控（库默认关闭）。计数维度是请求里的 clientUid，取不到才退化成 IP+UA。
    # 取值按前台评论的量级定（原先 @RateLimit 是 20 次/分钟，这里适度放宽）——
    # 匿名访客大量来自运营商 NAT，同一出口 IP 后面可能是很多真人，按 IP 卡太紧会误伤。
    # 后台登录共用这套阈值：它流量更低，且 nginx 侧另有更紧的 admin_captcha 桶兜底。
    req-frequency-limit-enable: true
    req-get-minute-limit: 30
    req-get-lock-limit: 10
    req-get-lock-seconds: 30
    req-check-minute-limit: 60
    req-verify-minute-limit: 60

# ============================ 文件存储默认项 ============================
designer:
  storage:
    # 私有文件代理下载前缀（需登录，须与 FileController /download/** 映射一致）
    default-url-prefix: "/admin-api/system/file/download/"
    # 公开文件代理下载前缀（免登录，须与 AppFileController /download/** 映射一致）
    public-url-prefix: "/app-api/system/file/download/"
    # 本地存储默认根目录（相对进程工作目录或绝对路径）
    local-default-path: "./data/uploads"
  sso:
    # 一次性登录票据有效期（秒）
    ticket-ttl: 60
