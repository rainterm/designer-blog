# 站点入口：按域名（server_name）分流
#
#   http://www.rainterm.cn    → 博客前台 blog（Nuxt SSR，反代到 blog:3000）
#   http://admin.rainterm.cn  → 管理后台 admin-web（本容器内的静态资源）
#   http://rainterm.cn        → 301 跳 www
#
# 为什么博客前台要单独一个容器：Nuxt SSR 必须按请求实时渲染 HTML
# （爬虫与社交分享爬虫不执行 JS，拿到的必须是成品页面），这是 nginx 静态托管做不到的。
# 管理后台仍是纯静态，继续留在这里，因此这个容器仍然只有 80 端口一个监听者。
#
# ⚠ 路由用的域名只在这一个文件里定义；部署脚本不读域名，改域名只需要改这里的 server_name。

# ============================================================================
# 频繁访问防护（限流）
#
# 为什么放在 nginx：它是本站唯一出口，位于 Node 之前。被它拦下的请求
# 不消耗 SSR 的 CPU，也不占用数据库连接 —— 应用层限流做不到这一点。
#
# 为什么读路径也要限：SSR 每渲染一页要查 文章 + 评论 + 分类 + 标签 + 站点设置，
# 外加 Node 端的 Markdown 渲染，一个廉价的 GET 远比静态文件贵。
# 写接口（评论 / 访问埋点）另有应用层 Redis 限流，这里只兜底读路径。
#
# 键用 $binary_remote_addr（比 $remote_addr 省内存）：只有本容器对外，
# 且各 location 都用 $remote_addr **覆写**而非追加 X-Forwarded-For，
# 所以这里拿到的就是真实客户端 IP。
#
# ⚠ 若将来在 nginx 前再加一层 CDN，必须用 real_ip 模块
#   （set_real_ip_from + real_ip_header）把 $remote_addr 还原成真实访客，
#   否则限流会退化成「按 CDN 节点 IP 统计」，一个节点超限就会误伤该节点下的所有人。
#   这与 README「限流误伤」那条是同一类坑。
#
# 阈值刻意偏宽松：宁可放过轻微刷量，也不能影响真实访客。要收紧就调这里的 rate。
# ============================================================================

# SSR 页面（/、/post/*、/category/*、/tag/*、/robots.txt）
# 一次全量加载只发 1 个请求，站内跳转走 /app-api，所以 60r/m 对真人绰绰有余
limit_req_zone $binary_remote_addr zone=blog_page:10m rate=60r/m;
# sitemap.xml：一次请求要翻页拉全站文章（500/页，最多 10 页），放大最狠，单独从严
limit_req_zone $binary_remote_addr zone=blog_sitemap:1m rate=6r/m;
# 浏览器侧公开接口：一次页面浏览会发若干个（站点设置 / 评论 / 验证码 / 埋点），
# 且验证码与评论在应用层还有一层更细的限流，这里只兜底
limit_req_zone $binary_remote_addr zone=blog_api:10m rate=120r/m;
# 滑块验证码（公开 URL 与其它浏览器侧接口一致：/app-api/captcha/get、/app-api/captcha/check）。
# 后端由 framework 的 AppCaptchaController 直接认这个前缀（插件原生的 /captcha/** 不对外）。
# /app-api/captcha/get 每发一次都要现画底图 + 写 Redis，是匿名接口里最贵的一个，
# 单列一个桶以免它把普通 API 的配额吃掉。应用侧还有一层按 clientUid 的分钟级限流
# （见 app.yml 的 aj.captcha.req-*），这里只按 IP 兜底。
limit_req_zone $binary_remote_addr zone=blog_captcha:10m rate=30r/m;

# 单 IP 并发连接数：挡「开一堆连接慢速占住」的玩法（浏览器同域一般 ≤6 条）
limit_conn_zone $binary_remote_addr zone=blog_conn:10m;

# 后台登录的滑块验证码（与前台同一个公开 URL：/app-api/captcha/get、/app-api/captcha/check）。
# 单独一个桶而不是复用 blog_captcha：后台只有管理员在用，
# 且验证码只在该账号连续失败达阈值后才出现，正常流量极低 —— 阈值可以比前台紧得多。
limit_req_zone $binary_remote_addr zone=admin_captcha:10m rate=20r/m;

# ============================================================================
# SSR 页面缓存（proxy_cache）
#
# 缓存 Nuxt 渲染出的整段 HTML，命中时完全不经过 Node。
# 能开的前提是 SSR 输出对所有访客一致：评论只取已审核内容，评论者身份 / 验证码 /
# 埋点都只在浏览器侧执行；阅读数也挂在这些埋点上（见 designer-module-blog/README.md），
# 缓存命中时照常上报，所以不会失真。
#
# max_size 必须有上限：否则随机 query 能把缓存撑爆，那只是把 CPU 压力换成磁盘压力。
# 各 directive 的取舍见 location / 处的注释。
# ============================================================================
proxy_cache_path /var/cache/nginx/blog
                 levels=1:2
                 keys_zone=blog_cache:10m
                 max_size=100m
                 inactive=10m
                 use_temp_path=off;

# ---- 裸域 → www ----
server {
    listen 80;
    server_name rainterm.cn;
    # 同一站点只保留一个入口，避免 http://rainterm.cn 与 www 形成两套 URL
    return 301 http://www.rainterm.cn$request_uri;
}

# ---- 博客前台（默认站点）----
server {
    # default_server：未匹配到任何 server_name 的请求（例如直接访问 IP）落到博客，
    # 而不是暴露管理后台
    listen 80 default_server;
    server_name www.rainterm.cn;
    charset utf-8;
    # 前台唯一的写接口是提交评论，2m 足够；比静态时代更收敛，少一个被灌大包的面
    client_max_body_size 2m;

    # 被限时回 429（而不是 nginx 默认的 503）：语义上就是「请求过于频繁」。
    # 这也让爬虫与监控能把「我被限流了」和「站点真的挂了」区分开 ——
    # 后者返回 5xx 会被搜索引擎降低抓取频率，而这个只是本次请求被拒。
    limit_req_status 429;
    limit_conn_status 429;

    # SSR 首屏是一整段 HTML（含正文与注水数据），开启压缩收益明显。
    # 静态资源由 Nitro 自己带 ETag/长缓存，这里只补压缩。
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml;

    # Nuxt SSR 服务。没有 URI 后缀 => 原始 URI 原样透传（含查询串）
    location / {
        limit_req zone=blog_page burst=30 nodelay;
        limit_conn blog_conn 20;

        # ---- SSR 页面缓存（缓存区定义见文件顶部）----
        proxy_cache blog_cache;
        # 默认键用的是 $proxy_host，也就是上游名 `blog:3000`，不含公开域名 ——
        # sitemap / og:url 的绝对地址按请求 Host 推导，键里必须带 $host。
        proxy_cache_key "$scheme$host$request_uri";
        # 时效由这里定，不被上游响应头否决。
        # 刻意不 ignore `Set-Cookie`：真出现它说明响应可能带用户态，那一次宁可放弃缓存。
        proxy_ignore_headers Cache-Control Expires;
        # 404 也缓存是有意的：随机 slug 扫描全打在缓存上，一次都到不了 Node。
        # 代价是刚发布的文章在 60 秒内可能仍返回 404。
        proxy_cache_valid 200 301 302 404 60s;
        # 冷 URL 上的并发回源合并成一次，其余等锁拿缓存
        proxy_cache_lock on;
        proxy_cache_lock_age 10s;
        proxy_cache_lock_timeout 10s;
        # Node 超时/报错时用过期页面顶上，不对访客回 502
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        # 命中情况（HIT / MISS / STALE），便于验证与排查
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://blog:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 评论限流、IP 归属地、访问统计都依赖真实客户端 IP，这里必须锁死来源。
        # X-Real-IP / X-Forwarded-For 用 $remote_addr **覆写**而不是追加：
        # $proxy_add_x_forwarded_for 是追加语义，会把客户端自带的伪造链一并传给下游，
        # 后端取的是首段 → 攻击者填什么就是什么。单级可信代理下必须丢弃客户端传入链。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # 供 sitemap.xml / robots.txt 推导绝对地址（见 server/utils/blogApi.js）
        proxy_set_header X-Forwarded-Proto $scheme;
        # 关掉 Connection 透传，让 nginx 与 Node 之间复用长连接
        proxy_set_header Connection "";
        # SSR 期间要现查数据库，给足时间；否则「后端慢」会表现为 Nginx 的 502
        proxy_read_timeout 60s;
    }

    # sitemap.xml：单独一个更严的桶（见文件顶部 zone 定义）。
    # 必须用 `=` 精确匹配才能抢在 `location /` 之前命中 —— 前缀匹配会被 `/` 吞掉。
    location = /sitemap.xml {
        limit_req zone=blog_sitemap burst=3 nodelay;
        # 最贵的读路径（一次要翻页拉全站文章），缓存后重复抓取不再触发翻页。
        # 其余 directive 同 location /。
        proxy_cache blog_cache;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        proxy_cache_lock_age 10s;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://blog:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 构建产物文件名带内容哈希。缓存头**不在这里覆写**：Nitro 对 /_nuxt/ 已经发出
    # `cache-control: public, max-age=31536000, immutable`（实测），
    # nginx 再插一手只会多出一个同名响应头。这里只关访问日志。
    #
    # 刻意**不加限流**：一次页面加载会并发拉十几个 JS/CSS chunk，
    # 给静态资源限流会直接表现为「页面加载不全」，而它本来就打不到后端、开销极低。
    location /_nuxt/ {
        proxy_pass http://blog:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    # 前台公开 API（浏览器侧导航、评论提交、公开文件下载走这里；SSR 期间由 Node 直连 server:8080）
    #
    # 公开文件下载 /app-api/system/file/download/** 也落在这里：存储配置标记为「公开」的
    # 封面 / 正文图片 URL 就是这个前缀（见 app.yml 的 public-url-prefix）。
    # 私有文件走 /admin-api（需登录），博客域名不暴露该前缀。
    location /app-api/ {
        # 这里有评论提交、埋点，都是随请求变化的写/私有响应，绝不能缓存。
        # 本 location 没启用 proxy_cache，写这行是为了防止将来把 proxy_cache 提到 server 级别。
        proxy_cache off;
        limit_req zone=blog_api burst=40 nodelay;
        limit_conn blog_conn 20;
        proxy_pass http://server:8080/app-api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 同 location / 处说明：覆写而非追加，避免客户端伪造的转发链被后端采信
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 滑块验证码：公开前缀就是 /app-api/captcha/**（后端 AppCaptchaController 直接映射这个路径），
    # 所以这里不需要改写 URI，只负责把它的限流桶与普通 API 分开。
    #
    # 这条比上面/下面的 `location /app-api/` 长，前缀匹配取最长者，因此不会被它吞掉。
    location /app-api/captcha/ {
        # 每次响应都不同（随机底图 + 一次性 token），绝不能进缓存
        proxy_cache off;
        limit_req zone=blog_captcha burst=10 nodelay;
        limit_conn blog_conn 20;
        proxy_pass http://server:8080/app-api/captcha/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 同 location / 处说明：覆写而非追加，避免客户端伪造的转发链被后端采信
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 插件原生的 /captcha/** 不对外（浏览器侧只用 /app-api/captcha/**）。
    # 显式 404 而不是落进 `location /`：后者会把验证码请求当 SSR 页面渲染（回 HTML），
    # 排查时表现为「JSON 解析失败」，而 404 能直接指出路径不对。
    location /captcha/ {
        return 404;
    }

    # 博客站点不承载后台入口。显式 404 而不是让 / 反代成前台页面（200），
    # 否则扫到 /admin-api/* 会拿到一个「看起来正常」的页面，排查时极具误导性。
    # 不需要限流：这里没有下游，返回的是一个常量 404。
    location /admin-api/ {
        return 404;
    }

    # 站点健康检查：反代到 Nuxt 的 /health，因此它同时代表「nginx + SSR 服务」都通。
    # 它**不**代表后端可用（/health 刻意不碰后端），后端状态看 admin 域的 /health。
    # 刻意不限流：Docker HEALTHCHECK 每 15s 就会打一次，且它是精确匹配，
    # 不会继承 `location /` 上的 limit_req。
    location = /health {
        # 健康检查必须反映当下状态，缓存会把「已经挂了」显示成健康
        proxy_cache off;
        proxy_pass http://blog:3000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # 容器自检：只证明本容器内 nginx 能正常响应，不牵扯任何下游。
    # 给 Docker HEALTHCHECK 用，避免前台抖动把入口容器也拖成 unhealthy。
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}

# ---- 管理后台 ----
server {
    listen 80;
    server_name admin.rainterm.cn;
    charset utf-8;
    client_max_body_size 100m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml;

    root /usr/share/nginx/html/admin;
    index index.html;

    # 被限时回 429（而不是 nginx 默认的 503），与博客站点口径一致：
    # 前端据此区分「请求过于频繁」和「服务真的挂了」。
    limit_req_status 429;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后台管理 API（含 SSE：关闭缓冲，长超时）
    location /admin-api/ {
        proxy_pass http://server:8080/admin-api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 同博客站点处说明：覆写而非追加，避免客户端伪造的转发链被后端采信
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 后台页面也会调前台接口（预览文章、站点设置等），同样需要
    location /app-api/ {
        proxy_pass http://server:8080/app-api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 登录用的滑块验证码：公开 URL 与博客前台一致，也是 /app-api/captcha/**。
    # 用 /app-api 而不是 /admin-api 的原因：
    #   · 验证码是匿名接口，而 /admin-api/** 在 Sa-Token 里强制登录；
    #   · 两个站点共用 designer-ui/shared/captcha 的同一份源码，路径一致才不用分叉。
    # 后端由 framework 的 AppCaptchaController 映射这个前缀，所以无需改写 URI；
    # 这条 location 只是换成更紧的限流桶（后台正常流量极低）。
    location /app-api/captcha/ {
        # 每次响应都不同（随机底图 + 一次性 token），绝不能进缓存
        proxy_cache off;
        limit_req zone=admin_captcha burst=5 nodelay;
        proxy_pass http://server:8080/app-api/captcha/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 同博客站点处说明：覆写而非追加，避免客户端伪造的转发链被后端采信
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 插件原生的 /captcha/** 不对外。后台的兜底是 `try_files ... /index.html`，
    # 不显式拦掉会返回 200 + index.html —— 前端表现为「JSON 解析失败」而不是 404。
    location /captcha/ {
        return 404;
    }

    # 健康检查：这里反代到后端，因此它同时代表「nginx + 后端」都通
    location = /health {
        proxy_pass http://server:8080/admin-api/system/health;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
