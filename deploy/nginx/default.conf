# 前端 Nginx：一个容器托管两个站点，按域名（server_name）分流
#
#   http://www.rainterm.cn    → 博客前台 blog-web（对外主站，default_server）
#   http://admin.rainterm.cn  → 管理后台 admin-web
#   http://rainterm.cn        → 301 跳 www
#
# 为什么合成一个容器：两个站点要共用宿主 80 端口并且按域名区分，只能有一个进程监听 80。
# 相比「两个静态容器 + 一层边缘路由」，一个 nginx 少一层转发、TLS/日志/缓存策略集中一处。
# 两个站点仍各自持有独立 root（/usr/share/nginx/html/blog、/html/admin），
# 且博客站点不暴露 /admin-api —— 前台被扫到也进不了后台 API。
#
# ⚠ 路由用的域名只在这一个文件里定义；部署脚本不读域名，改域名只需要改这里的 server_name。

# ---- 裸域 → www ----
server {
    listen 80;
    server_name rainterm.cn;
    # 同一站点只保留一个入口，避免 http://rainterm.cn 与 www 形成两套 URL
    return 301 http://www.rainterm.cn$request_uri;
}

# ---- 博客前台（默认站点）----
server {
    # default_server：未匹配到任何 server_name 的请求（例如直接访问 IP）落到博客，
    # 而不是暴露管理后台
    listen 80 default_server;
    server_name www.rainterm.cn;
    charset utf-8;
    client_max_body_size 20m;

    root /usr/share/nginx/html/blog;
    index index.html;

    # SPA 路由（/post/xxx、/tag/xxx、/category/xxx）全部回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 前台公开 API
    location /app-api/ {
        proxy_pass http://server:8080/app-api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 评论限流、IP 归属地、访问统计都依赖真实客户端 IP，这里必须锁死来源。
        # X-Real-IP / X-Forwarded-For 用 $remote_addr **覆写**而不是追加：
        # $proxy_add_x_forwarded_for 是追加语义，会把客户端自带的伪造链一并传给后端，
        # 而 Solon 取的是首段 → 攻击者填什么就是什么。单级可信代理下必须丢弃客户端传入链。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 博客站点不承载后台入口。显式 404 而不是让 / 的 try_files 回落成 index.html（200），
    # 否则扫到 /admin-api/* 会拿到一个「看起来正常」的页面，排查时极具误导性。
    location /admin-api/ {
        return 404;
    }

    # 健康检查：只验证本容器。静态站点不依赖后端，
    # 后端是否就绪由 admin 侧的 /health（反代后端）把关，两边语义分开，避免误判。
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# ---- 管理后台 ----
server {
    listen 80;
    server_name admin.rainterm.cn;
    charset utf-8;
    client_max_body_size 100m;

    root /usr/share/nginx/html/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后台管理 API（含 SSE：关闭缓冲，长超时）
    location /admin-api/ {
        proxy_pass http://server:8080/admin-api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 同 /app-api/ 处说明：覆写而非追加，避免客户端伪造的转发链被后端采信
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 后台页面也会调前台接口（预览文章、站点设置等），同样需要
    location /app-api/ {
        proxy_pass http://server:8080/app-api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查：这里反代到后端，因此它同时代表「nginx + 后端」都通
    location = /health {
        proxy_pass http://server:8080/admin-api/system/health;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
